# 소식지 뷰어를 GitHub Pages 에 올립니다.
# main 브랜치에 push 하면 자동으로 다시 배포됩니다. 빌드 과정은 없고,
# 저장소 안의 파일을 그대로 올립니다.
name: Deploy zine viewer to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포를 중간에 끊지 않습니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # configure-pages 를 deploy 와 같은 job 에 두면 안 됩니다.
  # github-pages 환경은 Pages 가 특정 브랜치로 설정돼 있을 때 그 브랜치에서만
  # 배포를 허용하므로, 설정을 바꾸는 단계까지 같이 막혀 버립니다(runner 도 못 받고 즉시 실패).
  # 환경이 걸리지 않은 job 에서 먼저 배포 방식을 workflow 로 바꾸고,
  # 그 다음 job 에서 실제 배포를 합니다.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # enablement: Pages 가 꺼져 있으면 켜고, 배포 방식을 이 워크플로로 맞춥니다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 저장소 루트를 그대로 올립니다(.git, .github 는 자동 제외).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
