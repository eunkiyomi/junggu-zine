  <script>
    /* ====================================================================
       소식지 설정 — 새 호를 올릴 때는 아래 세 줄만 고치면 됩니다.
       1) zine/ 폴더에 새 PDF 를 넣고
       2) pdf 경로와 downloadName 을 바꾸고
       3) title / issue 문구를 바꿉니다.
       ==================================================================== */
    window.ZINE_CONFIG = {
      pdf: 'zine/junggu-zine-2025-2H.pdf',
      downloadName: '서울시중구재가노인복지기관_2025하반기소식지.pdf',
      org: '서울시중구재가노인복지기관',
      title: '2025 하반기 소식지',
      issue: 'Vol.01',

      /* PDF 를 못 읽는 환경(구형 브라우저 등)에서 대신 보여줄 지면 이미지.
         쓰지 않으려면 빈 배열 [] 로 두세요. */
      fallbackPages: [
        'zine/001.jpg', 'zine/002.jpg', 'zine/003.jpg', 'zine/004.jpg',
        'zine/005.jpg', 'zine/006.jpg', 'zine/007.jpg', 'zine/008.jpg'
      ]
    };

    /* ?embed=1 이면 머리말·퍼가기 영역을 감춥니다. 화면이 한 번 깜빡이지 않도록
       모듈 스크립트보다 먼저, 여기서 클래스를 붙입니다. */
    (function () {
      var v = new URLSearchParams(location.search).get('embed');
      if (v !== null && v !== '0') document.documentElement.classList.add('is-embed');
    })();
  </script>
</head>

<body>
<div class="zv-app" id="app">

  <!-- ===== 머리말 (퍼가기 모드에서는 숨김) ===== -->
  <header class="zv-bar">

    <div class="zv-bar-actions">

          <path d="M4 9V4h5" /><path d="M20 9V4h-5" /><path d="M4 15v5h5" /><path d="M20 15v5h-5" />

  <!-- ===== 지면 ===== -->
  <main class="zv-stage" id="stage">
    <button type="button" class="zv-arrow prev" id="prevBtn" aria-label="이전 면">

        <path d="m15 5-7 7 7 7" />
      </svg>
    </button>

    <div class="zv-book-wrap" id="bookWrap">
      <div class="zv-book" id="book"></div>
    </div>

    <button type="button" class="zv-arrow next" id="nextBtn" aria-label="다음 면">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m9 5 7 7-7 7" />
      </svg>
    </button>

    <!-- 썸네일 서랍 -->
    <div class="zv-thumbs" id="thumbs" data-open="false" aria-hidden="true" aria-label="지면 목록">
      <div class="zv-thumbs-track" id="thumbsTrack"></div>
    </div>

    <!-- 로딩 / 오류 -->
    <div class="zv-overlay" id="loading">
      <div>
        <div class="zv-spinner" aria-hidden="true"></div>

        <p>잠시만 기다려 주세요.</p>
        <div class="zv-progress" aria-hidden="true"><i id="loadingBar"></i></div>
      </div>
    </div>

    <div class="zv-overlay" id="error" hidden>
      <div>
        <h2>소식지를 열 수 없습니다</h2>
        <p id="errorMsg"></p>
        <button type="button" class="zv-btn" onclick="location.reload()">다시 시도</button>
      </div>
    </div>
  </main>

  <!-- ===== 조작줄 ===== -->
  <div class="zv-controls">
    <div class="zv-pager">
      <button type="button" class="zv-btn zv-btn-icon" id="firstBtn" aria-label="첫 면으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m17 5-7 7 7 7" /><path d="M7 5v14" />
        </svg>
      </button>
      <span class="zv-counter" id="counter" aria-hidden="true"></span>
      <button type="button" class="zv-btn zv-btn-icon" id="lastBtn" aria-label="마지막 면으로">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m7 5 7 7-7 7" /><path d="M17 5v14" />
        </svg>
      </button>
    </div>

    <input type="range" class="zv-slider" id="slider" min="1" max="1" value="1" step="1" aria-label="지면 이동" />

    <div class="zv-tools">
      <button type="button" class="zv-btn" id="thumbsBtn" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

          <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /><path d="M11 8v6" /><path d="M8 11h6" />
        </svg>
        <span class="zv-btn-label">크게 보기</span>
      </button>

      <!-- 퍼가기(iframe) 모드에서만 보이는 버튼 — 머리말이 없으므로 여기에 둡니다. -->
      <button type="button" class="zv-btn zv-btn-icon zv-embed-only" id="embedFullBtn" aria-label="전체 화면">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4h5" /><path d="M20 9V4h-5" /><path d="M4 15v5h5" /><path d="M20 15v5h-5" />
        </svg>
      </button>
      <a class="zv-btn zv-embed-only" id="embedOpenBtn" href="./" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14 4h6v6" /><path d="M20 4 11 13" /><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
        </svg>
        <span class="zv-btn-label">새 창에서 보기</span>
      </a>
    </div>
  </div>

  <!-- ===== 확대 보기 ===== -->
  <div class="zv-zoom" id="zoom" data-open="false" role="dialog" aria-modal="true" aria-label="크게 보기" aria-hidden="true">
    <div class="zv-zoom-bar">
      <span class="zv-zoom-title" id="zoomTitle"></span>
      <div class="zv-tools">
        <button type="button" class="zv-btn zv-btn-icon" id="zoomOut" aria-label="축소">−</button>
        <button type="button" class="zv-btn zv-btn-icon" id="zoomIn" aria-label="확대">＋</button>
        <button type="button" class="zv-btn zv-btn-icon" id="zoomPrev" aria-label="이전 면">‹</button>
        <button type="button" class="zv-btn zv-btn-icon" id="zoomNext" aria-label="다음 면">›</button>
        <button type="button" class="zv-btn" id="zoomClose">닫기 ✕</button>
      </div>
    </div>
    <div class="zv-zoom-scroll" id="zoomScroll">

  </div>

  <p class="sr-only" id="live" role="status" aria-live="polite"></p>
